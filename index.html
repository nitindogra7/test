<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: #f9fafb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .form-container {
            width: 100%;
            max-width: 450px;
            background: #1f2937;
            padding: 35px;
            border-radius: 14px;
            border: 1px solid #374151;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        h2 {
            font-size: 26px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #9ca3af;
            font-size: 14px;
            margin-bottom: 28px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        input,
        textarea {
            width: 100%;
            padding: 14px 16px;
            background: #111827;
            border: 1px solid #374151;
            border-radius: 8px;
            color: #f9fafb;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input::placeholder,
        textarea::placeholder {
            color: #6b7280;
        }

        input:focus,
        textarea:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            padding: 14px;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        button:hover {
            background: #4f46e5;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        @media (max-width: 480px) {
            .form-container {
                padding: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="form-container">
        <h2>Get in touch</h2>
        <p class="subtitle">Fill out the form below and we'll get back to you.</p>

        <!-- Public HTML Form -->
        <form action="http://localhost:4000/api/forms-and-api/f/pp" method="POST">

            <input
                type="text"
                name="name"
                placeholder="Full name"
                required
            />

            <input
                type="email"
                name="email"
                placeholder="work@company.com"
                required
            />

            <textarea
                name="message"
                placeholder="How can we help?"
            ></textarea>

            <!-- Honeypot Spam Protection -->
            <input
                type="text"
                name="_gotcha"
                tabindex="-1"
                autocomplete="off"
                style="display:none !important;"
            />

            <button type="submit">Submit Form</button>

        </form>
    </div>

</body>
</html>
